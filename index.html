onami proíbem vender, emprestar ou transferir contas do jogo. Contas negociadas podem ser suspensas ou banidas pela Konami. Ao negociar, assumes esse risco e reconheces que a plataforma não garante a manutenção da conta."],["8. Direito do consumidor","Aplicam-se o Código de Defesa do Consumidor (Lei 8.078/1990) e o Decreto 7.962/2013 quando cabíveis. Quando aplicável, você pode exercer o direito de arrependimento do art. 49 do CDC, observada a natureza do produto digital e a legislação vigente."],["9. Condutas proibidas","É proibido: fraudar a plataforma; anunciar contas roubadas, invadidas ou de terceiros; combinar negócios fora da plataforma para evitar a comissão; criar várias contas para burlar regras ou suspensões."],["10. Responsabilidade","Não garantimos disponibilidade ininterrupta do serviço. Nossa responsabilidade é limitada na máxima medida permitida pela lei, sem prejuízo dos direitos do consumidor."],["11. Propriedade intelecsual","A marca, o logotipo e o mascote da eFootball Brasil pertencem aos seus titulares. eFootball e Konami são marcas dos respetivos proprietários."],["12. Alterações e foro","Podemos alterar estes Termos, avisando na plataforma; o uso continuado indica aceitação. Aplica-se a lei brasileira. Nas relações de consumo, o foro é o do domicílio do consumidor; nas demais, a comarca de Rondonópolis/MT."],["13. Conversas, suporte e recibos","As conversas dos pedidos podem conter dados de acesso a contas. Os administradores podem ler essas conversas, e as da Batalha, para mediar disputas e proteger a plataforma. As conversas dos pedidos são apagadas 7 dias depois de o pedido ser concluído ou reembolsado, e as da Batalha 30 dias depois do fim da partida. Nunca compartilhe dados de acesso fora do chat do pedido e troca e-mail e senha da conta assim que a receberes. Ao comprar, emitimos um recibo digital: é um comprovante sem valor fiscal. O suporte do site é feito por um assistente de inteligência artificial (Claude, da Anthropic); evita enviar dados pessoais nessas conversas. Ideias e pedidos de contato são encaminhados a um administrador."]]],priv:["Política de Privacidade (LGPD)",[["1. Controlador","70.106.657 PAULO HENRIQUE DE ARRUDA MACHADO (MEI), CNPJ 70.106.657/0001-13. Encarregado de proteção de dados (DPO): efootballbrasil.suporte@gmail.com. Esta política segue a Lei Geral de Proteção de Dados (Lei 13.709/2018)."],["2. Dados que recolhemos","Cadastro: nome, data de nascimento, e-mail e nickname. Vendedores: nome completo, CPF, endereço e telefone. Também recolhemos conteúdos e imagens que você publica, dados de transações e registros de acesso (IP, data e hora), conforme o Marco Civil da Internet."],["3. Finalidades e bases legais","Execução do contrato (conta, comunidade e marketplace); cumprimento de obrigação legal; exercício regular de direitos em processo judicial, administrativo ou arbitral; legítimo interesse (segurança e prevenção de fraude); e consentimento, para comunicações opcionais, que você pode revogar a qualquer momento."],["4. CPF e endereço dos vendedores","São usados apenas para identificar o vendedor, prevenir fraudes, cumprir obrigações legais e permitir a defesa de direitos, incluindo evensual ação judicial contra quem cometa fraude. O acesso é restrito à equipe autorizada e fica registrado."],["5. Compartilhamento","Podemos compartilhar dados com processadores de pagamento, serviços de hospedagem e autoridades, mediante obrigação legal ou ordem judicial. Não vendemos os seus dados."],["6. Retenção","Mantemos os dados enquanto a conta estiver ativa e pelos prazos exigidos por lei (por exemplo, registros de acesso e dados fiscais) ou necessários para defesa de direitos."],["7. Os seus direitos","Nos termos do art. 18 da LGPD, você pode pedir confirmação do tratamento, acesso, correção, anonimização, portabilidade, eliminação, informação sobre compartilhamento e revogação do consentimento, em Minha conta ou pelo e-mail do encarregado. Você pode também reclamar à ANPD."],["8. Segurança","Aplicamos controle de acessos, criptografia e registros de auditoria. Nenhum sistema é totalmente seguro; em caso de incidente relevante, comunicaremos os afetados e a ANPD, conforme o art. 48 da LGPD."],["9. Crianças e adolescentes","Maiores de 13 anos podem usar a comunidade, com tratamento no seu melhor interesse. Comprar e vender é proibido a menores de 18 anos."],["10. Cookies e alterações",'Usamos apenas armazenamento essencial ao funcionamento. Contamos visitas de forma anônima, com um código aleatório do aparelho, sem IP, nome ou e-mail, apenas para saber quantas pessoas usam o site; o navegador com "Do Not Track" ativo não é contado. Ferramentas de análise de terceiros só serão ativadas com o seu consentimento. Esta política pode ser asualizada, com aviso na plataforma.'],["11. Conversas, suporte com IA e segurança","Tratamos o conteúdo das conversas dos pedidos e da Batalha para entregar a conta, mediar disputas e prevenir fraude. Podem ler: os participantes e os administradores. Prazos: 7 dias após o fim do pedido e 30 dias após o fim da partida. No suporte, as suas mensagens são enviadas ao serviço de IA da Anthropic para gerar respostas (pode haver transferência internacional de dados) e, se pedires, ficam na caixa de entrada de um administrador. Usamos o seu e-mail para confirmar a conta, recuperar a senha e enviar recibos. Registamos eventos de segurança (por exemplo, alterações de administradores e acessos a dados sensíveis) para proteger a plataforma. Você pode pedir acesso, correção ou eliminação dos seus dados no contato de suporte."]]],vend:["Termos do Vendedor",[["1. Elegibilidade","Só podem vender maiores de 18 anos, autorizados pela equipe e com o cadastro de vendedor completo e verdadeiro."],["2. Identificação","Informas nome completo, CPF, data de nascimento e endereço reais. Autorizas o seu uso para identificação, prevenção de fraude e fornecimento às autoridades competentes mediante requisição legal ou ordem judicial."],["3. T
