*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 500px at 50% -10%,#0f3a22,transparent),var(--bg);color:var(--tx);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:rgba(6,19,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 6px}
.top{display:flex;align-items:center;gap:10px;max-width:1040px;margin:auto}
.logo{width:40px;height:52px;background:var(--mas) center/contain no-repeat;flex:none}
.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;color:var(--y);font-weight:600;font-size:.7rem}
.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1040px;margin:6px auto 0;padding-bottom:4px;scrollbar-width:none}
nav a{white-space:nowrap;color:var(--mu);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:.92rem;border:1px solid transparent}
nav a.on{color:var(--tx);background:#14301f;border-color:var(--line)}
nav a .ni{display:inline-block;transition:transform .25s}nav a:hover .ni,nav a.on .ni{transform:scale(1.25) rotate(-8deg)}
main{max-width:1040px;margin:auto;padding:16px 14px 90px}
h2{margin:6px 0 12px}h3{margin:6px 0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--g)}
.sub{color:var(--mu);font-size:.85rem}.body{white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;background:#14301f;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.75rem;color:var(--y)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#16301f;color:var(--tx);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.p{background:var(--g);border-color:var(--g)}.btn.d{background:#4a1b1b;border-color:#7a2a2a}.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
button:disabled{opacity:.5}
.f{display:grid;gap:4px;margin:8px 0;font-size:.9rem;color:var(--mu)}
input,select,textarea{font:inherit;width:100%;background:#0a1a11;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin:8px 0}.ck input{width:20px;min-height:20px;margin-top:3px}
.err{color:var(--r);font-size:.9rem;min-height:1.2em;margin:6px 0}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{flex:1}.tab.on{background:var(--g);border-color:var(--g)}
dialog{background:#0b1c12;color:var(--tx);border:1px solid var(--line);border-radius:16px;width:min(560px,94vw);max-height:90vh;overflow:auto;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.doc h4{margin:14px 0 4px;color:var(--y)}.doc p{margin:0;color:#cfe2d6;font-size:.92rem}
.hero{text-align:center;padding:26px 8px}.hero h1{margin:6px 0;font-size:1.7rem}.hero p{color:var(--mu)}
.warn{background:#2a2410;border:1px solid #5a4b12;border-radius:12px;padding:10px 12px;font-size:.88rem;color:#f3e3a0;margin:10px 0}
footer{max-width:1040px;margin:0 auto;padding:10px 14px 30px;color:var(--mu);font-size:.8rem;text-align:center}footer a{color:var(--y)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#14301f;border:1px solid var(--g);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.grid>.card{margin:0}
.mb{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;width:64px;height:84px;padding:0;border:0;background:var(--mas) center/contain no-repeat;filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));cursor:pointer;transition:transform .2s;min-height:0}.mb:hover{transform:translateY(-4px) scale(1.04)}.mb .bb{position:absolute;left:-14px;top:2px;width:30px;height:30px;border-radius:50%;background:var(--y);color:#06130c;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.4)}.mb .bn{position:absolute;right:-2px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:#e5484d;color:#fff;font:700 .75rem system-ui;display:none;place-items:center}.mb .bn.on{display:grid}
#nav a[href="#batalha"] .ni{animation:bt 3.2s ease-in-out infinite}@keyframes bt{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-14deg) scale(1.2)}94%{transform:rotate(10deg) scale(1.2)}}

/* ===== Visual v2: feixes de luz, vidro e mascote animado ===== */
body{background:#06130c;position:relative}
body::before{content:"";position:fixed;inset:-10% -30% 0 -30%;z-index:-2;pointer-events:none;
background:
 repeating-linear-gradient(100deg,transparent 0 70px,rgba(110,170,30,.34) 110px,rgba(40,120,30,.18) 170px,transparent 230px 300px),
 radial-gradient(900px 420px at 50% -8%,rgba(150,190,20,.55),transparent 70%),
 linear-gradient(180deg,#1f5a10 0%,#12380f 28%,#0c2012 60%,#07130c 100%);
animation:beams 26s ease-in-out infinite alternate;will-change:transform}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.55),transparent 60%)}
@keyframes beams{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
header{background:linear-gradient(180deg,rgba(20,60,15,.72),rgba(8,26,14,.55));-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,.12);border-top:0;border-radius:0 0 22px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-3px);border-color:var(--y)}
nav a.on{background:rgba(255,223,0,.14);border-color:rgba(255,223,0,.45);color:var(--y)}
.btn.p{background:linear-gradient(180deg,#00b347,#008a35);box-shadow:0 6px 18px rgba(0,151,57,.4)}
dialog{background:rgba(9,28,17,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
main:not(.q)>*{animation:rise .45s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* mascote: mais presença e movimento próprio */
.hero{padding:30px 8px 22px}
.hero h1{font-size:2rem;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.hero .logo{width:150px!important;height:192px!important;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));transform-origin:50% 90%;animation:idle 3.6s ease-in-out infinite,wave 7s ease-in-out infinite;cursor:pointer}
.logo{transform-origin:50% 90%;transition:transform .2s}
header .logo{animation:sway 5s ease-in-out infinite}
.logo.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 1!important}
@keyframes idle{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes wave{0%,72%,100%{rotate:0deg}78%{rotate:-9deg}84%{rotate:8deg}90%{rotate:-6deg}95%{rotate:3deg}}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:3deg}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.12,.88)}55%{transform:translateY(-34px) scale(.95,1.08) rotate(-8deg)}80%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
main>h2::before{content:"";display:inline-block;width:46px;height:60px;margin-right:10px;vertical-align:middle;background:var(--mas) center/contain no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));transform-origin:50% 90%}
.mb{width:78px;height:100px;animation:idle 3.4s ease-in-out infinite}
.mb:has(.bn.on){animation:idle 3.4s ease-in-out infinite,nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{rotate:0deg}76%{rotate:-10deg}82%{rotate:9deg}88%{rotate:-7deg}94%{rotate:4deg}}
.mb:active{transform:scale(.92)}

#alerta{position:fixed;top:0;left:0;right:0;z-index:200;background:#c1121f;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;text-align:center;font-weight:700;display:none;animation:redp 1s ease-in-out infinite}
#alerta.on{display:block}#alerta button{margin-left:8px;min-height:34px;padding:4px 12px;background:#fff;color:#c1121f;border:0}
@keyframes redp{0%,100%{background:#c1121f}50%{background:#7a0a12}}
.sm{padding:6px 10px;border-radius:10px;margin:4px 0;max-width:88%}.sm.u{background:rgba(0,151,57,.25);margin-left:auto}.sm.a{background:rgba(255,223,0,.14)}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 18px}
.atalho{text-align:center;padding:16px 8px;margin:0;display:grid;gap:2px;justify-items:center}.atalho .e{font-size:2.2rem;transition:transform .25s}.atalho:hover .e{transform:scale(1.2) rotate(-8deg)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;background:#1c4a2b;color:var(--y);font-weight:700;vertical-align:middle;margin-right:6px;flex:none;border:1px solid rgba(255,255,255,.25)}
#user{display:flex;gap:6px;align-items:center}#user>.btn:first-child{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#0a1a11;display:block;margin-bottom:8px}
.mkgal{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.mkgal img{height:150px;border-radius:10px;flex:none}
.price{font-size:1.25rem;font-weight:800;color:var(--y)}

/* ===== v3: acessibilidade, ranking, administração ===== */
.skip{position:absolute;left:-999px;top:0;background:var(--y);color:#000;padding:8px 14px;z-index:300;border-radius:0 0 10px 0}.skip:focus{left:0}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}

const SND={on:(()=>{try{return localStorage.getItem("efb_snd")!=="0"}catch(e){return true}})(),ctx:null};
const actx=()=>{try{if(!SND.ctx)SND.ctx=new(window.AudioContext||window.webkitAudioContext)();if(SND.ctx.state==="suspended")SND.ctx.resume();return SND.ctx}catch(e){return null}};

function tone(c,t,f,d,type,v){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}
function shaker(c,t,d,v){const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const o=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=5000;g.gain.value=v;o.buffer=b;o.connect(f);f.connect(g);g.connect(c.destination);o.start(t)}
function sambaDing(){if(!SND.on)return;const c=actx();if(!c)return;const t=c.currentTime+.02;
 [[0,1175],[.15,1175],[.3,880],[.45,1175],[.6,880]].forEach(([d,f])=>{tone(c,t+d,f,.22,"triangle",.28);tone(c,t+d,f*2.76,.12,"sine",.08);shaker(c,t+d+.075,.05,.18)});
 tone(c,t,110,.3,"sine",.5);tone(c,t+.45,110,.3,"sine",.5)}
let SIREN=null;
function siren(on){if(SIREN){clearInterval(SIREN.i);clearTimeout(SIREN.t);try{SIREN.o.stop()}catch(e){}SIREN=null}if(!on||!SND.on)return;const c=actx();if(!c)return;
 const o=c.createOscillator(),g=c.createGain();o.type="sawtooth";g.gain.value=.18;o.connect(g);g.connect(c.destination);o.start();
 const sw=()=>{const t=c.currentTime;o.frequency.cancelScheduledValues(t);o.frequency.setValueAtTime(600,t);o.frequency.linearRampToValueAtTime(1100,t+.6);o.frequency.linearRampToValueAtTime(600,t+1.2)};
 sw();SIREN={o,i:setInterval(sw,1200),t:setTimeout(()=>siren(false),30000)}}

function alertBar(on){const a=$("#alerta");a.classList.toggle("on",on);a.innerHTML=on?'⚠️ Instabilidade detectada: o servidor não está respondendo.'+(isA()?' <button data-a="mute">Silenciar</button>':""):""}
const REALHOST=/(^|\.)(github\.io|efootballbrasil\.com\.br)$/.test(location.hostname);
async function health(){if(document.hidden||!REALHOST)return;let ok=false;try{const r=await fetch(SB+"/auth/v1/health",{headers:{apikey:KEY},cache:"no-store"});ok=r.ok}catch(e){}
 if(ok){HFAIL=0;if(DOWN){DOWN=false;alertBar(false);siren(false);toast("Servidor normalizado.")}return}
 if(!navigator.onLine)return;if(++HFAIL>=3&&!DOWN){DOWN=true;alertBar(true);if(isA())siren(true)}}
setInterval(health,20000);
/* suporte */
const SUP={o:false,t:null,list:false};let SUPL=[];
const supSeen=id=>{try{localStorage.setItem("efb_sup_seen",String(id))}catch(e){}};
async function supThreads(){const th=await api("/rest/v1/support_threads?select=id,status,updated_at,profiles(nick,avatar_url)&status=neq.resolved&order=updated_at.desc&limit=50");if(!th.length)return[];
 const ms=await api("/rest/v1/support_messages?select=thread_id,role,id&order=id.desc&limit=300"),last={};ms.forEach(m=>{if(!(m.thread_id in last))last[m.thread_id]=m});
 return th.map(t=>({...t,wait:!!last[t.id]&&last[t.id].role==="user"}))}
async function supCount(){
 if(isA()){SUPL=await supThreads();if(SUP.o)supRefresh();return SUPL.filter(x=>x.wait).length}
 const ms=await api("/rest/v1/support_messages?select=id,role&order=id.desc&limit=30");let s=0;try{s=+localStorage.getItem("efb_sup_seen")||0}catch(e){}
 if(SUP.o){if(ms[0])supSeen(ms[0].id);supRefresh();return 0}
 return ms.filter(m=>m.role==="admin"&&m.id>s).length}
async function supRefresh(){if(!SUP.o)return;
 if(SUP.list){const e=$("#sl");if(!e)return;e.innerHTML=SUPL.length?SUPL.map(t=>`<div class="card" data-a="sthread" data-id="${esc(t.id)}" style="cursor:pointer"><div class="row between"><b>${av(t,20)}${esc(t.profiles&&t.profiles.nick||"?")}</b>${t.wait?'<span class="tag">aguardando resposta</span>':'<span class="sub">respondido</span>'}</div><div class="sub">${when(t.updated_at)}</div></div>`).join(""):'<div class="card sub">Nenhuma conversa em aberto.</div>';return}
 const e=$("#sc");if(!e)return;const q=SUP.t?`&thread_id=eq.${SUP.t}`:"";const ms=await api(`/rest/v1/support_messages?select=id,role,body&order=id.asc&limit=100${q}`);
 const near=e.scrollHeight-e.scrollTop-e.clientHeight<60;e.innerHTML=ms.length?ms.map(m=>`<div class="sm ${m.role==="admin"?"a":"u"}"><b>${m.role==="admin"?"Equipe":(isA()?"Usuário":"Você")}:</b> ${esc(m.body)}</div>`).join(""):'<p class="sub">Conte como podemos ajudar. Um administrador responde por aqui.</p>';
 if(near||!e.dataset.i){e.scrollTop=e.scrollHeight;e.dataset.i=1}}
const supChat=()=>`<div id="sc" style="height:260px;overflow:auto"></div><div class="row" style="flex-wrap:nowrap;margin-top:8px"><input id="sm" maxlength="500" placeholder="Escreva sua mensagem"><button class="btn p" data-a="ssend">Enviar</button></div><div class="err" id="fe"></div>`;
$("#dg").addEventListener("close",()=>{SUP.o=false;SUP.t=null;SUP.list=false});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sm"){e.preventDefault();const b=document.querySelector('[data-a="ssend"]');if(b)b.click()}});
Object.assign(A,{
 mute:()=>{siren(false)},
 snd:()=>{SND.on=!SND.on;try{localStorage.setItem("efb_snd",SND.on?"1":"0")}catch(e){}if(SND.on)sambaDing();else siren(false);A.inbox()},
 sopen:async()=>{if(isA()){SUP.o=true;SUP.list=true;SUP.t=null;dlg('<h3>🛟 Caixa de suporte</h3><div id="sl"></div><button class="btn" data-a="inbox">Voltar</button>');SUPL=await supThreads();supRefresh()}
  else{SUP.o=true;SUP.list=false;SUP.t=null;dlg('<h3>🛟 Suporte</h3>'+supChat()+'<button class="btn" data-a="inbox" style="margin-top:8px">Voltar</button>');await supRefresh()}},
 sthread:async id=>{if(!isA()||!UUID.test(id))return;SUP.o=true;SUP.list=false;SUP.t=id;dlg('<h3>🛟 Conversa</h3>'+supChat()+'<div class="row" style="margin-top:8px"><button class="btn" data-a="sopen">← Lista</button><button class="btn d" data-a="sres" data-id="'+id+'">Marcar como resolvida</button></div>');await supRefresh()},
 ssend:async()=>{const t=val("sm");if(!t)return;$("#sm").value="";
  if(isA()){if(!SUP.t)return;await rpc("support_admin_reply",{p_thread:SUP.t,p_body:t})}else await rpc("support_send",{p_body:t});await supRefresh();bg()},
 sres:async id=>{if(!isA()||!UUID.test(id)||!confirm("Marcar esta conversa como resolvida?"))return;await rpc("support_resolve",{p_thread:id});toast("Conversa resolvida.");A.sopen()},
 inbox:()=>{if(!ME)return authDlg("login");SUP.o=false;
  const waiting=SUPL.filter(x=>x.wait).length;
  dlg(`<h3>Mensagens</h3>${ACT?`<div class="card" data-a="gob" style="cursor:pointer">⚔️ <b>Partida ${esc(ACT.mode)}</b> em andamento<div class="sub">Toque para abrir a partida e o chat</div></div>`:'<div class="card sub">Nenhuma partida em andamento.</div>'}
  <div class="card" data-a="sopen" style="cursor:pointer">🛟 <b>${isA()?"Caixa de suporte":"Falar com o suporte"}</b>${isA()&&waiting?` <span class="tag">${waiting} aguardando</span>`:""}<div class="sub">${isA()?"Conversas dos usuários":"Fale com a equipe"}</div></div>
  <div class="card row between"><span>🔔 Som das notificações</span><button class="btn sm" data-a="snd">${SND.on?"Ligado":"Desligado"}</button></div><button class="btn" data-a="close">Fechar</button>`)}
});
</script>
<script>
/* ===== Foto de perfil ===== */
async function cropAvatar(f){let src;try{src=await createImageBitmap(f)}catch(e){src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
 const w=src.width,h=src.height,m=Math.min(w,h),c=document.createElement("canvas");c.width=c.height=256;c.getContext("2d").drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,256,256);
 return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("falha")),"image/jpeg",.85))}
const avPath=u=>u?u.slice((SB+"/storage/v1/object/public/images/").length):"";
async function perfilDlg(){dlg(`<h3>Meu perfil</h3><div style="text-align:center;margin:10px 0">${av(ME,96)}<div><b>${esc(ME.nick)}</b></div></div><label class="btn p" style="display:flex;justify-content:center;cursor:pointer">📷 Escolher foto<input id="pf" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><p class="sub">A foto aparece no ranking, fórum, fichas e partidas. Use uma imagem sua ou do seu time, sem conteúdo ofensivo.</p><div class="err" id="fe"></div><div class="row">${avUrl(ME.avatar_url)?'<button class="btn d" data-a="pfdel">Remover foto</button>':""}<button class="btn" data-a="close">Fechar</button></div>`)}
Object.assign(A,{perfil:()=>{if(ME)perfilDlg()},
 pfdel:async()=>{const old=avPath(avUrl(ME.avatar_url));await rpc("set_my_avatar",{p_url:null});if(old)fetch(SB+"/storage/v1/object/images/"+old,{method:"DELETE",headers:{apikey:KEY,Authorization:"Bearer "+SES.access_token}}).catch(()=>{});ME.avatar_url=null;toast("Foto removida.");render(true);perfilDlg()}});
document.addEventListener("change",async e=>{if(e.target.id!=="pf"||!e.target.files[0]||!ME)return;const f=e.target.files[0];
 if(!/^image\//.test(f.type)||f.size>15e6)return fail("Escolha uma imagem (JPG, PNG ou WebP) de até 15 MB.");
 try{const blob=await cropAvatar(f);if(SES.expires_at*1000<Date.now()+60000)await refresh();
  const path=ME.id+"/avatar-"+Date.now()+".jpg",r=await fetch(SB+"/storage/v1/object/images/"+path,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+SES.access_token,"Content-Type":"image/jpeg"},body:blob});
  if(!r.ok)throw new Error("O envio da foto falhou ("+r.status+").");
  const old=avPath(avUrl(ME.avatar_url)),url=SB+"/storage/v1/object/public/images/"+path;await rpc("set_my_avatar",{p_url:url});
  if(old)fetch(SB+"/storage/v1/object/images/"+old,{method:"DELETE",headers:{apikey:KEY,Authorization:"Bearer "+SES.access_token}}).catch(()=>{});
  ME.avatar_url=url;toast("Foto atualizada!");render(true);perfilDlg()}catch(err){fail(err.message||"Não foi possível enviar a foto.")}});
</script>
<script>
/* ===== Marketplace (fase 1: anúncios; compra e pagamento ainda desligados) ===== */
const BRL=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const imgOk=u=>typeof u==="string"&&u.startsWith(SB+"/storage/v1/object/public/images/");
const cpfOk=c=>{c=String(c).replace(/\D/g,"");if(c.length!==11||/^(\d)\1+$/.test(c))return false;const d=n=>{let t=0;for(let i=0;i<n;i++)t+=+c[i]*(n+1-i);t=t*10%11;return t===10?0:t};return d(9)===+c[9]&&d(10)===+c[10]};
let MK={max:10000,ord:"new"},MKR=[];
async function resizeImg(f,max){let src;try{src=await createImageBitmap(f)}catch(e){src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
 const k=Math.min(1,max/Math.max(src.width,src.height)),c=document.createElement("canvas");c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);
 return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("falha")),"image/jpeg",.82))}
async function upImg(blob,name){if(SES.expires_at*1000<Date.now()+60000)await refresh();
 const r=await fetch(SB+"/storage/v1/object/images/"+name,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+SES.access_token,"Content-Type":"image/jpeg"},body:blob});
 if(!r.ok)throw new Error("O envio de uma foto falhou ("+r.status+").");return SB+"/storage/v1/object/public/images/"+name}
async function pMarket(){
 const ord=MK.ord==="asc"?"price_cents.asc":MK.ord==="desc"?"price_cents.desc":"created_at.desc";
 MKR=await api(`/rest/v1/listings?status=eq.ativo&price_cents=lte.${MK.max*100}&select=id,seller_id,title,ovr,coins,price_cents,description,image_urls,created_at,profiles(nick,avatar_url)&order=${ord}&limit=60`);
 let fav=new Set(),box="";
 if(ME){try{fav=new Set((await api("/rest/v1/favorites?select=listing_id")).map(x=>x.listing_id))}catch(e){}
  try{
   if(ME.role==="vendedor"||isA()){const sd=await api("/rest/v1/seller_data?user_id=eq."+ME.id+"&select=user_id");
     box=sd.length?'<button class="btn p" data-a="mnew">+ Novo anúncio</button>':'<p class="sub">Para anunciar, complete o cadastro de vendedor.</p><button class="btn p" data-a="mseller">Completar cadastro de vendedor</button>'}
   else{const rq=await api("/rest/v1/seller_requests?user_id=eq."+ME.id+"&select=user_id");
     box=rq.length?'<p class="sub">✅ Pedido enviado. Um administrador vai analisar.</p>':'<p class="sub">Quer vender? Só maiores de 18 anos.</p><button class="btn p" data-a="mreq">Quero ser vendedor</button>'}
  }catch(e){}}
 let pend="";if(isA()){try{const rq=await api("/rest/v1/seller_requests?select=user_id,created_at,profiles(nick,avatar_url)&order=created_at.asc");
  if(rq.length)pend=`<div class="card"><h3>Pedidos de vendedor</h3>${rq.map(r=>`<div class="row between" style="padding:4px 0"><span>${av(r,24)}${nk(r)}</span><span class="row"><button class="btn sm p" data-a="mappr" data-id="${esc(r.user_id)}">Aprovar</button><button class="btn sm d" data-a="mrej" data-id="${esc(r.user_id)}">Recusar</button></span></div>`).join("")}</div>`}catch(e){}}
 return `<div class="row between"><h2>🛒 Marketplace</h2></div><div class="warn"><b>Compra e pagamento ainda não estão ativos.</b> Por enquanto você pode ver os anúncios e favoritar. A Konami proíbe a venda de contas: leia os <a href="#" data-a="doc" data-id="vend" style="color:var(--y)">Termos do Vendedor</a> antes de anunciar.</div>`+
 `<div class="card">${box||'<p class="sub">Entre na sua conta para vender ou favoritar.</p>'}</div>${pend}`+
 `<div class="card row" style="flex-wrap:nowrap"><label class="f" style="flex:2;margin:0">Preço máximo: <b id="mxv">${BRL(MK.max*100)}</b><input id="mxs" type="range" min="100" max="10000" step="100" value="${MK.max}"></label><label class="f" style="flex:1;margin:0">Ordem<select id="mo"><option value="new" ${MK.ord==="new"?"selected":""}>Recentes</option><option value="asc" ${MK.ord==="asc"?"selected":""}>Menor preço</option><option value="desc" ${MK.ord==="desc"?"selected":""}>Maior preço</option></select></label></div>`+
 (MKR.length?`<div class="grid">${MKR.map(l=>`<article class="card" data-a="mview" data-id="${esc(l.id)}" style="cursor:pointer">${imgOk(l.image_urls[0])?`<img class="mkimg" src="${esc(l.image_urls[0])}" alt="" loading="lazy">`:""}<h3>${esc(l.title)}</h3><div class="sub">${l.ovr?esc(l.ovr)+" OVR":""}${l.ovr&&l.coins?" · ":""}${l.coins?esc(l.coins)+" moedas":""}</div><div class="row between"><span class="price">${BRL(l.price_cents)}</span><span class="sub">${fav.has(l.id)?"❤️":""}</span></div><div class="sub">${av(l,18)}${nk(l)}</div></article>`).join("")}</div>`:'<div class="card sub">Nenhum anúncio com esses filtros.</div>');
}

document.addEventListener("input",e=>{if(e.target.id==="mxs"){const v=$("#mxv");if(v)v.textContent=BRL(e.target.value*100)}});
const UFS="AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");
Object.assign(A,{
 mreq:async()=>{try{await api("/rest/v1/seller_requests",{method:"POST",body:{user_id:ME.id},headers:{Prefer:"return=minimal"}})}catch(e){if(e.status!==409)throw e}toast("Pedido enviado.");render(true)},
 mappr:async id=>{if(!isA()||!UUID.test(id))return;await rpc("admin_set_role",{p_user:id,p_role:"vendedor"});toast("Vendedor aprovado.");render(true)},
 mrej:async id=>{if(!isA()||!UUID.test(id)||!confirm("Recusar este pedido?"))return;await api("/rest/v1/seller_requests?user_id=eq."+id,{method:"DELETE"});render(true)},
 mseller:()=>dlg(`<h3>Cadastro de vendedor</h3><p class="sub">Esses dados são sensíveis e ficam protegidos: só administradores autorizados acessam, com registro de auditoria. Veja a <a href="#" data-a="doc" data-id="priv" style="color:var(--y)">Política de Privacidade</a>.</p>${fld("s_n","Nome completo",'maxlength="80"')}${fld("s_c","CPF (só números)",'inputmode="numeric" maxlength="14"')}${fld("s_d","Data de nascimento",'type="date"')}${fld("s_t","Telefone com DDD",'inputmode="tel" maxlength="16"')}${fld("s_cep","CEP",'inputmode="numeric" maxlength="9"')}${fld("s_r","Rua",'maxlength="80"')}<div class="row" style="flex-wrap:nowrap">${fld("s_nu","Número",'maxlength="10"')}${fld("s_co","Complemento",'maxlength="30"')}</div>${fld("s_b","Bairro",'maxlength="60"')}<div class="row" style="flex-wrap:nowrap">${fld("s_ci","Cidade",'maxlength="60"')}<label class="f" style="flex:0 0 90px">UF<select id="s_u">${UFS.map(u=>`<option>${u}</option>`).join("")}</select></label></div><label class="ck"><input type="checkbox" id="s_k"><span>Li e aceito os <a href="#" data-a="doc" data-id="vend" style="color:var(--y)">Termos do Vendedor</a>.</span></label><div class="err" id="fe"></div><div class="row"><button class="btn p" data-a="msaveseller">Salvar</button><button class="btn" data-a="close">Cancelar</button></div>`),
 msaveseller:async()=>{const g=id=>val(id),cpf=g("s_c").replace(/\D/g,""),nasc=g("s_d");
  if(g("s_n").length<5)return fail("Informe o nome completo.");if(!cpfOk(cpf))return fail("CPF inválido.");if(!nasc||age(nasc)<18)return fail("É preciso ter 18 anos ou mais.");
  if(g("s_t").replace(/\D/g,"").length<10)return fail("Telefone inválido.");if(g("s_cep").replace(/\D/g,"").length!==8)return fail("CEP inválido.");
  for(const [id,m] of [["s_r","Informe a rua."],["s_nu","Informe o número."],["s_b","Informe o bairro."],["s_ci","Informe a cidade."]])if(!g(id))return fail(m);
  if(!$("#s_k").checked)return fail("Aceite os Termos do Vendedor.");
  try{await api("/rest/v1/seller_data",{method:"POST",body:{user_id:ME.id,nome:g("s_n"),cpf,nasc,tel:g("s_t"),cep:g("s_cep").replace(/\D/g,""),rua:g("s_r"),num:g("s_nu"),comp:g("s_co")||null,bairro:g("s_b"),cidade:g("s_ci"),uf:$("#s_u").value,terms_version:V},headers:{Prefer:"return=minimal"}})}
  catch(e){return fail(e.status===409?"Este CPF já está cadastrado.":e.message)}closeDlg();toast("Cadastro salvo.");render(true)},
 mnew:()=>dlg(`<h3>Novo anúncio</h3><div class="warn">Nunca coloque e-mail, senha ou códigos da conta no anúncio ou nas fotos.</div>${fld("m_t","Título (5 a 60)",'maxlength="60"')}<div class="row" style="flex-wrap:nowrap">${fld("m_o","OVR",'type="number" min="0" max="999" inputmode="numeric"')}${fld("m_c","Moedas",'type="number" min="0" inputmode="numeric"')}</div>${fld("m_p","Preço em R$ (1 a 10.000)",'type="number" min="1" max="10000" step="0.01" inputmode="decimal"')}<label class="f">Descrição<textarea id="m_d" maxlength="800"></textarea></label><label class="f">Fotos (1 a 5)<input id="m_f" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="err" id="fe"></div><div class="row"><button class="btn p" data-a="msave">Publicar</button><button class="btn" data-a="close">Cancelar</button></div>`),
 msave:async()=>{const t=val("m_t"),pr=Math.round(parseFloat(val("m_p").replace(",","."))*100),fs=[...$("#m_f").files];
  if(t.length<5)return fail("O título precisa de 5 a 60 caracteres.");if(!(pr>=100&&pr<=1000000))return fail("O preço deve ficar entre R$ 1,00 e R$ 10.000,00.");if(fs.length<1||fs.length>5)return fail("Envie de 1 a 5 fotos.");
  const bt=$("[data-a=msave]");bt.disabled=true;toast("Enviando fotos...");
  try{const urls=[];for(let i=0;i<fs.length;i++)urls.push(await upImg(await resizeImg(fs[i],1000),ME.id+"/m-"+Date.now()+"-"+i+".jpg"));
   await api("/rest/v1/listings",{method:"POST",body:{seller_id:ME.id,title:t,ovr:parseInt(val("m_o"),10)||0,coins:parseInt(val("m_c"),10)||0,price_cents:pr,description:val("m_d")||null,image_urls:urls},headers:{Prefer:"return=minimal"}});
   closeDlg();toast("Anúncio publicado!");render(true)}catch(e){bt.disabled=false;fail(e.message)}},
 mview:id=>{const l=MKR.find(x=>x.id===id);if(!l)return;const mine=ME&&(ME.id===l.seller_id),imgs=l.image_urls.filter(imgOk);
  dlg(`<h3>${esc(l.title)}</h3><div class="mkgal">${imgs.map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div><div class="price">${BRL(l.price_cents)}</div><div class="sub">${l.ovr?esc(l.ovr)+" OVR":""}${l.ovr&&l.coins?" · ":""}${l.coins?esc(l.coins)+" moedas":""}</div>${l.description?`<p class="body">${esc(l.description)}</p>`:""}<div class="sub">Vendedor: ${av(l,18)}${nk(l)}</div><div class="warn">Compra e pagamento ainda não estão ativos.</div><div class="row"><button class="btn" data-a="mfav" data-id="${esc(l.id)}">❤️ Favoritar</button>${mine||isA()?`<button class="btn d" data-a="mdel" data-id="${esc(l.id)}">Remover anúncio</button>`:""}<button class="btn" data-a="close">Fechar</button></div>`)},
 mfav:async id=>{if(!ME)return authDlg("login");try{await api("/rest/v1/favorites",{method:"POST",body:{user_id:ME.id,listing_id:id},headers:{Prefer:"return=minimal"}});toast("Favoritado.")}catch(e){if(e.status===409){await api(`/rest/v1/favorites?listing_id=eq.${id}&user_id=eq.${ME.id}`,{method:"DELETE"});toast("Removido dos favoritos.")}else throw e}render(true)},
 mdel:async id=>{if(!UUID.test(id)||!confirm("Remover este anúncio?"))return;await api("/rest/v1/listings?id=eq."+id,{method:"PATCH",body:{status:"removido"},headers:{Prefer:"return=minimal"}});closeDlg();toast("Anúncio removido.");render(true)}
});
</script>
<script>
/* ===== v3: configurações do usuário, ranking, administração do ELO ===== */
const PREF0={anim:true,bg:true,glass:true,hc:false,dys:false,fs:100};
let PREF=Object.assign({},PREF0);try{Object.assign(PREF,JSON.parse(localStorage.getItem("efb_prefs")||"{}"))}catch(e){}
function applyPrefs(){const h=document.documentElement.classList;h.toggle("no-anim",!PREF.anim);h.toggle("no-bg",!PREF.bg);h.toggle("no-glass",!PREF.glass);h.toggle("hc",!!PREF.hc);h.toggle("dys",!!PREF.dys);
 document.documentElement.style.fontSize=(+PREF.fs||100)+"%"}

/* fotos do formulário */
function prevs(){const e=$("#m_pv");if(!e)return;e.innerHTML=MKF.map((f,i)=>`<div class="pv ${i?"":"cover"}"><img src="${esc(URL.createObjectURL(f))}" alt=""><button class="x" data-a="mrmf" data-id="${i}" aria-label="Remover foto">✕</button>${i?`<button class="k" style="border:0;cursor:pointer;min-height:0" data-a="mcov" data-id="${i}">Capa</button>`:'<span class="k">CAPA</span>'}</div>`).join("")}
document.addEventListener("change",e=>{if(e.target.id!=="m_f")return;MKF=MKF.concat([...e.target.files]).slice(0,8);e.target.value="";prevs()});
const mForm=(l)=>{l=l||{};return `<div class="warn">Nunca coloque e-mail, senha ou códigos da conta no anúncio ou nas fotos.</div>${fld("m_t","Título (5 a 60)",'maxlength="60" value="'+esc(l.title||"")+'"')}
 <div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1">Plataforma<select id="m_pl"><option value="">—</option>${["Mobile","PC","PlayStation","Xbox"].map(x=>`<option ${l.platform===x?"selected":""}>${x}</option>`).join("")}</select></label>${fld("m_o","OVR do time",'type="number" min="0" max="999" inputmode="numeric" value="'+esc(l.ovr||"")+'"')}</div>
 <div class="row" style="flex-wrap:nowrap">${fld("m_c","Moedas",'type="number" min="0" inputmode="numeric" value="'+esc(l.coins||"")+'"')}${fld("m_lv","Nível da conta",'type="number" min="0" inputmode="numeric" value="'+esc(l.acct_level||"")+'"')}</div>
 ${fld("m_p","Preço em R$ (1 a 10.000)",'type="number" min="1" max="10000" step="0.01" inputmode="decimal" value="'+(l.price_cents?l.price_cents/100:"")+'"')}
 <label class="f">Destaques (jogadores e itens principais)<textarea id="m_h" maxlength="500">${esc(l.highlights||"")}</textarea></label><label class="f">Descrição<textarea id="m_d" maxlength="800">${esc(l.description||"")}</textarea></label>`};
const mRead=()=>({title:val("m_t"),platform:$("#m_pl").value||null,ovr:parseInt(val("m_o"),10)||0,coins:parseInt(val("m_c"),10)||0,acct_level:parseInt(val("m_lv"),10)||null,price:Math.round(parseFloat(val("m_p").replace(",","."))*100),highlights:val("m_h")||null,description:val("m_d")||null});
const mCheck=d=>d.title.length<5?"O título precisa de 5 a 60 caracteres.":!(d.price>=100&&d.price<=1000000)?"O preço deve ficar entre R$ 1,00 e R$ 10.000,00.":"";
async function favSet(id){let on;try{await api("/rest/v1/favorites",{method:"POST",body:{user_id:ME.id,listing_id:id},headers:{Prefer:"return=minimal"}});on=true}catch(e){if(e.status===409){await api(`/rest/v1/favorites?listing_id=eq.${id}&user_id=eq.${ME.id}`,{method:"DELETE"});on=false}else throw e}return on}
Object.assign(A,{
 mmine:()=>{MK.mine=!MK.mine;render(true)},
 vadd:async()=>{if(!isA())return;const n=val("vn"),er=$("#fe4");if(!/^[A-Za-z0-9_.]{3,20}$/.test(n))return er.textContent="Digite o nickname exato.";
  const u=await api("/rest/v1/profiles?nick=eq."+encodeURIComponent(n)+"&select=id,role");if(!u.length)return er.textContent="Nenhum membro com esse nickname.";if(u[0].role==="admin")return er.textContent="Administradores já podem publicar.";
  await rpc("admin_set_role",{p_user:u[0].id,p_role:"vendedor"});toast(n+" agora é vendedor autorizado.");render(true)},
 vrem:async(id,el)=>{if(!isA()||!UUID.test(id)||!confirm("Remover "+el.dataset.n+" dos vendedores? Os anúncios dele continuam, mas ele não poderá publicar novos."))return;await rpc("admin_set_role",{p_user:id,p_role:"membro"});toast("Vendedor removido.");render(true)},
 mnew:()=>{MKF=[];dlg(`<h3>Novo anúncio</h3>${mForm()}<label class="f">Fotos (até 8). A primeira é a capa.<input id="m_f" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="prevs" id="m_pv"></div><div class="err" id="fe"></div><div class="row"><button class="btn p" data-a="msave">Publicar</button><button class="btn" data-a="close">Cancelar</button></div>`)},
 mrmf:id=>{MKF.splice(+id,1);prevs()},mcov:id=>{const f=MKF.splice(+id,1)[0];MKF.unshift(f);prevs()},
 msave:async()=>{const d=mRead(),m=mCheck(d);if(m)return fail(m);if(MKF.length<1)return fail("Envie de 1 a 8 fotos.");
  const bt=$("[data-a=msave]");bt.disabled=true;
  try{const urls=[];for(let i=0;i<MKF.length;i++){toast("Enviando foto "+(i+1)+" de "+MKF.length+"...");urls.push(await upImg(await resizeImg(MKF[i],1400),ME.id+"/m-"+Date.now()+"-"+i+".jpg"))}
   await api("/rest/v1/listings",{method:"POST",body:{seller_id:ME.id,title:d.title,platform:d.platform,ovr:d.ovr,coins:d.coins,acct_level:d.acct_level,price_cents:d.price,highlights:d.highlights,description:d.description,image_urls:urls},headers:{Prefer:"return=minimal"}});
   MKF=[];closeDlg();toast("Anúncio publicado!");render(true)}catch(e){bt.disabled=false;fail(e.message)}},
 medit:id=>{if(!MKL||MKL.id!==id)return;dlg(`<h3>Editar anúncio</h3>${mForm(MKL)}<p class="sub">As fotos não podem ser trocadas aqui. Para trocar as fotos, remova o anúncio e publique de novo.</p><div class="err" id="fe"></div><div class="row"><button class="btn p" data-a="meditsave" data-id="${esc(id)}">Salvar</button><button class="btn" data-a="close">Cancelar</button></div>`)},
 meditsave:async id=>{const d=mRead(),m=mCheck(d);if(m)return fail(m);
  await api("/rest/v1/listings?id=eq."+id,{method:"PATCH",body:{title:d.title,platform:d.platform,ovr:d.ovr,coins:d.coins,acct_level:d.acct_level,price_cents:d.price,highlights:d.highlights,description:d.description},headers:{Prefer:"return=minimal"}});closeDlg();toast("Anúncio atualizado.");render(true)},
 mdel:async id=>{if(!UUID.test(id)||!confirm("Remover este anúncio?"))return;await api("/rest/v1/listings?id=eq."+id,{method:"PATCH",body:{status:"removido"},headers:{Prefer:"return=minimal"}});toast("Anúncio removido.");location.hash="#marketplace"},
 mfav:async id=>{if(!ME)return authDlg("login");const on=await favSet(id);document.querySelectorAll('[data-fav="'+id+'"]').forEach(b=>{b.textContent=b.classList.contains("lf")?(on?"❤️":"🤍"):(on?"❤️ Favorito":"🤍 Favoritar")});toast(on?"Favoritado.":"Removido dos favoritos.")},
 mint:async id=>{if(!ME)return authDlg("login");let on;try{await api("/rest/v1/interests",{method:"POST",body:{user_id:ME.id,listing_id:id},headers:{Prefer:"return=minimal"}});on=true}catch(e){if(e.status===409){await api(`/rest/v1/interests?listing_id=eq.${id}&user_id=eq.${ME.id}`,{method:"DELETE"});on=false}else throw e}
  const b=$("#mib");if(b)b.textContent=on?"✓ Tenho interesse":"🙋 Tenho interesse";toast(on?"Interesse registrado. O vendedor poderá ver.":"Interesse removido.")},
 mshare:()=>{const u=location.href;if(navigator.share)navigator.share({title:MKL?MKL.title:"eFootball Brasil",url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast("Link copiado!"),()=>toast(u))},
 mnav:d=>{const g=$("#gal");if(g)g.scrollBy({left:(+d)*g.clientWidth,behavior:"smooth"})},
 mgo:i=>{const g=$("#gal");if(g)g.scrollTo({left:(+i)*g.clientWidth,behavior:"smooth"})},
 mlb:i=>{if(!MKIMGS.length)return;closeLb();const d=document.createElement("div");d.id="lb";d.setAttribute("role","dialog");d.setAttribute("aria-label","Fotos em tela cheia");
  d.innerHTML=`<button class="lbx" data-a="mlbx" aria-label="Fechar">✕</button><div class="lbs" id="lbs">${MKIMGS.map(u=>`<div class="lbi"><img src="${esc(u)}" alt=""></div>`).join("")}</div><span class="gc" id="lbc">${(+i)+1}/${MKIMGS.length}</span>`;
  document.body.appendChild(d);document.body.style.overflow="hidden";const s=$("#lbs");s.style.scrollBehavior="auto";s.scrollLeft=(+i)*s.clientWidth},
 mlbx:()=>closeLb()
});
</script>
</body>
</html>
