*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 500px at 50% -10%,#0f3a22,transparent),var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:rgba(6,19,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 6px}
.top{display:flex;align-items:center;gap:10px;max-width:880px;margin:auto}
.logo{width:40px;height:52px;background:var(--mas) center/contain no-repeat;flex:none}
.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;color:var(--y);font-weight:600;font-size:.7rem}
.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;max-width:880px;margin:6px auto 0;padding-bottom:4px;scrollbar-width:none}
nav a{white-space:nowrap;color:var(--mu);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:.92rem;border:1px solid transparent}
nav a.on{color:var(--tx);background:#14301f;border-color:var(--line)}
nav a .ni{display:inline-block;transition:transform .25s}nav a:hover .ni,nav a.on .ni{transform:scale(1.25) rotate(-8deg)}
main{max-width:880px;margin:auto;padding:16px 14px 90px}
h2{margin:6px 0 12px}h3{margin:6px 0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--g)}
.sub{color:var(--mu);font-size:.85rem}.body{white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;background:#14301f;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.75rem;color:var(--y)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#16301f;color:var(--tx);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.p{background:var(--g);border-color:var(--g)}.btn.d{background:#4a1b1b;border-color:#7a2a2a}.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
button:disabled{opacity:.5}
.f{display:grid;gap:4px;margin:8px 0;font-size:.9rem;color:var(--mu)}
input,select,textarea{font:inherit;width:100%;background:#0a1a11;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin:8px 0}.ck input{width:20px;min-height:20px;margin-top:3px}
.err{color:var(--r);font-size:.9rem;min-height:1.2em;margin:6px 0}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{flex:1}.tab.on{background:var(--g);border-color:var(--g)}
dialog{background:#0b1c12;color:var(--tx);border:1px solid var(--line);border-radius:16px;width:min(560px,94vw);max-height:90vh;overflow:auto;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.doc h4{margin:14px 0 4px;color:var(--y)}.doc p{margin:0;color:#cfe2d6;font-size:.92rem}
.hero{text-align:center;padding:26px 8px}.hero h1{margin:6px 0;font-size:1.7rem}.hero p{color:var(--mu)}
.warn{background:#2a2410;border:1px solid #5a4b12;border-radius:12px;padding:10px 12px;font-size:.88rem;color:#f3e3a0;margin:10px 0}
footer{max-width:880px;margin:0 auto;padding:10px 14px 30px;color:var(--mu);font-size:.8rem;text-align:center}footer a{color:var(--y)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#14301f;border:1px solid var(--g);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const SB="https://poxujpgrrsynvcnvxqkl.supabase.co",KEY="sb_publishable_bZSSuNdEOygQjNnwnhrsCg_PntBECjt",V="2026-11-12";
const DOCS={"termos": ["Termos de Uso", [["1. Quem somos", "A plataforma eFootball Brasil é operada por [RAZÃO SOCIAL], CNPJ [CNPJ], com sede em [ENDEREÇO COMPLETO], contacto [E-MAIL DE SUPORTE]. Somos um site independente, sem qualquer vínculo com a Konami."], ["2. Aceitação", "Ao criar conta, declaras que leste e aceitas estes Termos e a Política de Privacidade. Se não concordares, não uses a plataforma."], ["3. Cadastro", "As informações do cadastro devem ser verdadeiras, completas e atualizadas. A idade mínima para a comunidade é de 13 anos. Comprar e vender no marketplace é permitido apenas a maiores de 18 anos. És responsável pela guarda da tua senha e pela atividade da tua conta."], ["4. Comunidade", "O conteúdo que publicas (tópicos, comentários, fichas e imagens) é da tua responsabilidade. É proibido publicar ofensas, discriminação, spam, conteúdo ilegal ou que viole direitos de terceiros. Podemos ocultar ou remover conteúdos e suspender contas que violem estas regras, e concedes-nos licença não exclusiva para exibir o conteúdo na plataforma."], ["5. Marketplace", "A plataforma atua como intermediária entre compradores e vendedores autorizados e não é proprietária das contas anunciadas. O preço é definido pelo vendedor. A plataforma retém uma comissão, atualmente de 10% do valor de cada venda concluída; alterações aplicam-se apenas a vendas futuras."], ["6. Pagamento, entrega e disputas", "O pagamento fica retido pela plataforma até o comprador confirmar o recebimento. Confirmada a entrega, o valor é liberado ao vendedor descontada a comissão. Se houver problema, o comprador pode abrir uma disputa, que a equipa analisa com base nas provas apresentadas pelas partes."], ["7. Aviso sobre as regras do jogo", "Os termos da Konami proíbem vender, emprestar ou transferir contas do jogo. Contas negociadas podem ser suspensas ou banidas pela Konami. Ao negociar, assumes esse risco e reconheces que a plataforma não garante a manutenção da conta."], ["8. Direito do consumidor", "Aplicam-se o Código de Defesa do Consumidor (Lei 8.078/1990) e o Decreto 7.962/2013 quando cabíveis. Quando aplicável, podes exercer o direito de arrependimento do art. 49 do CDC, observada a natureza do produto digital e a legislação vigente."], ["9. Condutas proibidas", "É proibido: fraudar a plataforma; anunciar contas roubadas, invadidas ou de terceiros; combinar negócios fora da plataforma para evitar a comissão; criar várias contas para burlar regras ou suspensões."], ["10. Responsabilidade", "Não garantimos disponibilidade ininterrupta do serviço. Nossa responsabilidade é limitada na máxima medida permitida pela lei, sem prejuízo dos direitos do consumidor."], ["11. Propriedade intelectual", "A marca, o logótipo e o mascote da eFootball Brasil pertencem aos seus titulares. eFootball e Konami são marcas dos respetivos proprietários."], ["12. Alterações e foro", "Podemos alterar estes Termos, avisando na plataforma; o uso continuado indica aceitação. Aplica-se a lei brasileira. Nas relações de consumo, o foro é o do domicílio do consumidor; nas demais, a comarca de [CIDADE/UF]."], ["13. Conversas, suporte e recibos", "As conversas dos pedidos podem conter dados de acesso a contas. Os administradores podem ler essas conversas, e as da Batalha, para mediar disputas e proteger a plataforma. As conversas dos pedidos são apagadas 7 dias depois de o pedido ser concluído ou reembolsado, e as da Batalha 30 dias depois do fim da partida. Nunca partilhes dados de acesso fora do chat do pedido e troca e-mail e senha da conta assim que a receberes. Ao comprar, emitimos um recibo digital: é um comprovante sem valor fiscal. O suporte do site é feito por um assistente de inteligência artificial (Claude, da Anthropic); evita enviar dados pessoais nessas conversas. Ideias e pedidos de contacto são encaminhados a um administrador."]]], "priv": ["Política de Privacidade (LGPD)", [["1. Controlador", "[RAZÃO SOCIAL], CNPJ [CNPJ]. Encarregado de proteção de dados (DPO): [E-MAIL DO ENCARREGADO]. Esta política segue a Lei Geral de Proteção de Dados (Lei 13.709/2018)."], ["2. Dados que recolhemos", "Cadastro: nome, data de nascimento, e-mail e nickname. Vendedores: nome completo, CPF, endereço e telefone. Também recolhemos conteúdos e imagens que publicas, dados de transações e registos de acesso (IP, data e hora), conforme o Marco Civil da Internet."], ["3. Finalidades e bases legais", "Execução do contrato (conta, comunidade e marketplace); cumprimento de obrigação legal; exercício regular de direitos em processo judicial, administrativo ou arbitral; legítimo interesse (segurança e prevenção de fraude); e consentimento, para comunicações opcionais, que podes revogar a qualquer momento."], ["4. CPF e endereço dos vendedores", "São usados apenas para identificar o vendedor, prevenir fraudes, cumprir obrigações legais e permitir a defesa de direitos, incluindo eventual ação judicial contra quem cometa fraude. O acesso é restrito à equipa autorizada e fica registado."], ["5. Compartilhamento", "Podemos partilhar dados com processadores de pagamento, serviços de hospedagem e autoridades, mediante obrigação legal ou ordem judicial. Não vendemos os teus dados."], ["6. Retenção", "Mantemos os dados enquanto a conta estiver ativa e pelos prazos exigidos por lei (por exemplo, registos de acesso e dados fiscais) ou necessários para defesa de direitos."], ["7. Os teus direitos", "Nos termos do art. 18 da LGPD, podes pedir confirmação do tratamento, acesso, correção, anonimização, portabilidade, eliminação, informação sobre partilha e revogação do consentimento, em Minha conta ou pelo e-mail do encarregado. Podes também reclamar à ANPD."], ["8. Segurança", "Aplicamos controlo de acessos, criptografia e registos de auditoria. Nenhum sistema é totalmente seguro; em caso de incidente relevante, comunicaremos os afetados e a ANPD, conforme o art. 48 da LGPD."], ["9. Crianças e adolescentes", "Maiores de 13 anos podem usar a comunidade, com tratamento no seu melhor interesse. Comprar e vender é proibido a menores de 18 anos."], ["10. Cookies e alterações", "Usamos apenas armazenamento essencial ao funcionamento. Ferramentas de análise só serão ativadas com o teu consentimento. Esta política pode ser atualizada, com aviso na plataforma."], ["11. Conversas, suporte com IA e segurança", "Tratamos o conteúdo das conversas dos pedidos e da Batalha para entregar a conta, mediar disputas e prevenir fraude. Podem ler: os participantes e os administradores. Prazos: 7 dias após o fim do pedido e 30 dias após o fim da partida. No suporte, as tuas mensagens são enviadas ao serviço de IA da Anthropic para gerar respostas (pode haver transferência internacional de dados) e, se pedires, ficam na caixa de entrada de um administrador. Usamos o teu e-mail para confirmar a conta, recuperar a senha e enviar recibos. Registamos eventos de segurança (por exemplo, alterações de administradores e acessos a dados sensíveis) para proteger a plataforma. Podes pedir acesso, correção ou eliminação dos teus dados no contacto de suporte."]]], "vend": ["Termos do Vendedor", [["1. Elegibilidade", "Só podem vender maiores de 18 anos, autorizados pela equipa e com o cadastro de vendedor completo e verdadeiro."], ["2. Identificação", "Informas nome completo, CPF, data de nascimento e endereço reais. Autorizas o seu uso para identificação, prevenção de fraude e fornecimento às autoridades competentes mediante requisição legal ou ordem judicial."], ["3. Titularidade das contas", "Só podes anunciar contas de tua titularidade, obtidas de forma lícita. É proibido vender contas de terceiros, roubadas, invadidas ou partilhadas."], ["4. Anúncios", "As descrições e imagens devem ser verdadeiras e próprias. Nunca publiques senhas ou dados de acesso no anúncio."], ["5. Comissão e repasse", "Recebes 90% do valor da conta; a plataforma retém 10% de comissão (percentual vigente na data da compra). O repasse ocorre após a confirmação do comprador ou decisão favorável em disputa."], ["6. Entrega", "Deves entregar a conta pelo canal indicado pela plataforma, no prazo combinado, e guardar prova da entrega."], ["7. Disputas e reembolsos", "Em caso de disputa, a equipa decide com base nas provas. O valor pode ser devolvido ao comprador, e respondes pelos danos que causares."], ["8. Fraude", "Em caso de fraude, a plataforma pode reter valores, suspender a conta e comunicar o caso às autoridades. Podes responder civil e criminalmente."], ["9. Riscos do jogo", "Estás ciente de que os termos da Konami proíbem a transferência de contas e de que a conta pode ser suspensa ou banida."], ["10. Tributos e encerramento", "És responsável pelas tuas obrigações fiscais. A autorização de vendedor pode ser suspensa ou revogada em caso de descumprimento destes termos."], ["11. Entrega e conversas", "A entrega dos dados da conta é feita apenas no chat do pedido, que os administradores podem ler. Não combines entrega nem pagamento fora da plataforma. Ao concluir a venda, o comprador recebe um recibo digital sem valor fiscal. Disputas podem ser decididas por um administrador com base no chat e nas provas apresentadas."]]]};

function msgOf(j,st){const m=j&&(j.msg||j.message||j.error_description||j.error)||"",c=j&&(j.code||j.error_code);
 if(ERR[m])return ERR[m];
 if(c==="over_email_send_rate_limit"||c==="over_request_rate_limit"||st===429)return "Muitas tentativas. Espere um pouco e tente de novo.";
 if(/Database error saving new user/i.test(m))return "Não foi possível criar a conta. O nickname pode já estar em uso ou ter caracteres inválidos (use 3 a 20 letras, números, _ ou .).";
 if(c==="23505")return "Esse valor já está em uso.";
 if(c==="42501"||st===403)return "Sem permissão para isso.";
 if(c==="23514"||c==="22001")return "Algum campo está fora das regras de tamanho ou formato.";
 if(/password/i.test(m)&&/weak|should be/i.test(m))return "Senha fraca. Use 8 ou mais caracteres, com letras e números.";
 return m||"Erro "+st}
async function api(path,o){o=o||{};const auth=o.auth!==false;
 if(auth&&SES&&SES.expires_at*1000<Date.now()+60000)await refresh();
 const h=Object.assign({apikey:KEY,"Content-Type":"application/json"},o.headers||{});if(auth&&SES)h.Authorization="Bearer "+SES.access_token;
 let r;try{r=await fetch(SB+path,{method:o.method||"GET",headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body)})}catch(e){throw new Error("Sem ligação. Verifique a internet.")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw Object.assign(new Error(msgOf(j,r.status)),{status:r.status});return j}
const setSes=j=>store({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:(j.user&&j.user.id)||(SES&&SES.uid)});

  const j=await api("/auth/v1/signup",{method:"POST",body:{email:e,password:p,data:{nick:k,nome:n,nasc:d,terms_version:V,marketing:$("#ck_m").checked}},auth:false});
  if(j&&j.access_token)return enter(j);PEND={e};codeF("Confirme o seu e-mail","Enviamos um código de 6 dígitos para <b>"+esc(e)+"</b>. Veja também a caixa de spam.","Confirmar","vk")},
 vk:async()=>{const c=val("v_c");if(!/^\d{6,8}$/.test(c))return fail("Digite o código de 6 dígitos.");await enter(await api("/auth/v1/verify",{method:"POST",body:{type:"signup",email:PEND.e,token:c},auth:false}))},
 fp:()=>dlg(`<h3>Recuperar senha</h3><p class="sub">Informe o e-mail da conta. Enviamos um código de 6 dígitos.</p>${fld("f_e","E-mail",'type="email" maxlength="120"')}<div class="err" id="fe"></div><button class="btn p" data-a="fp1">Enviar código</button>`),
 fp1:async()=>{const e=val("f_e").toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return fail("E-mail inválido.");await api("/auth/v1/recover",{method:"POST",body:{email:e},auth:false});PEND={e};
  codeF("Trocar a senha","Se o e-mail existir, enviamos um código. Digite-o e escolha a nova senha.","Trocar senha","fp2",fld("f_p","Nova senha (8+, com letras e números)",'type="password" autocomplete="new-password" maxlength="72"'))},
 fp2:async()=>{const c=val("v_c"),p=$("#f_p").value;if(!/^\d{6,8}$/.test(c))return fail("Digite o código de 6 dígitos.");if(p.length<8||!/[a-zA-Z]/.test(p)||!/\d/.test(p))return fail("A senha precisa de 8+ caracteres, com letras e números.");
  setSes(await api("/auth/v1/verify",{method:"POST",body:{type:"recovery",email:PEND.e,token:c},auth:false}));await api("/auth/v1/user",{method:"PUT",body:{password:p}});store(null);ME=null;authDlg("login");toast("Senha alterada. Entre com a nova senha.");render()},
 /* publicações (admin) */
 cnew:k=>{if(!isA())return;dlg(`<h3>Nova ${k==="noticia"?"notícia":"formação"}</h3>${fld("c_c","Categoria",'maxlength="30" value="Geral"')}${fld("c_t","Título (5 a 100 caracteres)",'maxlength="100"')}<label class="f">Texto<textarea id="c_b" maxlength="4000"></textarea></label><div class="err" id="fe"></div><div class="row"><button class="btn p" data-a="csave" data-id="${k}">Publicar</button><button class="btn" data-a="close">Cancelar</button></div>`)},
 csave:async k=>{if(!isA())return;const c=val("c_c")||"Geral",t=val("c_t"),b=val("c_b");if(t.length<5)return fail("O título precisa de pelo menos 5 caracteres.");if(b.length<10)return fail("O texto precisa de pelo menos 10 caracteres.");
  await api("/rest/v1/content",{method:"POST",body:{kind:k,category:c,title:t,body:b,author:ME.id},headers:{Prefer:"return=minimal"}});closeDlg();toast("Publicado!");render()},
 cdel:async id=>{if(!isA()||!UUID.test(id)||!confirm("Apagar esta publicação?"))return;await api("/rest/v1/content?id=eq."+id,{method:"DELETE"});toast("Apagado.");render()},
 /* fórum */
 tnew:()=>{if(!ME)return authDlg("login");dlg(`<h3>Novo tópico</h3><label class="f">Categoria<select id="t_c"><option>Geral</option><option>Táticas</option><option>Dúvidas</option></select></label>${fld("t_t","Título (5 a 120 caracteres)",'maxlength="120"')}<label class="f">Mensagem<textarea id="t_b" maxlength="1500"></textarea></label><div class="err" id="fe"></div><div class="row"><button class="btn p" data-a="tsave">Publicar</button><button class="btn" data-a="close">Cancelar</button></div>`)},
 tsave:async()=>{const t=val("t_t"),b=val("t_b");if(t.length<5)return fail("O título precisa de pelo menos 5 caracteres.");if(b.length<5)return fail("Escreva a mensagem (mínimo 5 caracteres).");
  const r=await api("/rest/v1/threads",{method:"POST",body:{author:ME.id,category:$("#t_c").value,title:t,body:b},headers:{Prefer:"return=representation"}});closeDlg();toast("Tópico criado!");location.hash=r&&r[0]?"#t-"+r[0].id:"#forum";render()},
 tdel:async id=>{if(!ME||!UUID.test(id)||!confirm("Apagar este tópico e as respostas?"))return;await api("/rest/v1/threads?id=eq."+id,{method:"DELETE"});toast("Tópico apagado.");location.hash="#forum"},
 rsend:async id=>{const b=val("rb");if(b.length<2)return($("#fe2").textContent="Escreva a resposta.");
  await api("/rest/v1/replies",{method:"POST",body:{thread_id:id,author:ME.id,body:b},headers:{Prefer:"return=minimal"}});toast("Resposta enviada.");render()},
 rdel:async id=>{if(!ME||!UUID.test(id)||!confirm("Apagar esta resposta?"))return;await api("/rest/v1/replies?id=eq."+id,{method:"DELETE"});render()},
 /* administradores (só o CEO) */
 aadd:async()=>{if(!isCeo())return;const q=val("an");if(!/^[A-Za-z0-9_.]{3,20}$/.test(q))return($("#fe2").textContent="Digite o nickname exato.");
  const r=await api("/rest/v1/profiles?nick=ilike."+encodeURIComponent(q)+"&select=id,nick,role&limit=5"),u=r.find(x=>x.nick.toLowerCase()===q.toLowerCase());
  if(!u)return($("#fe2").textContent="Não há conta com esse nickname. A pessoa precisa criar conta primeiro.");if(u.role==="admin")return($("#fe2").textContent="Essa pessoa já é administradora.");
  await api("/rest/v1/rpc/admin_set_role",{method:"POST",body:{p_user:u.id,p_role:"admin"}});toast("@"+u.nick+" agora é administrador.");render()},
 arem:(id,el)=>{if(!isCeo())return;dlg(`<h3>Remover administrador?</h3><p class="sub">@${esc(el.dataset.n)} perde o acesso à administração. A conta continua existindo.</p><div class="row"><button class="btn d" data-a="arem2" data-id="${esc(id)}">Remover</button><button class="btn" data-a="close">Cancelar</button></div>`)},
 arem2:async id=>{if(!isCeo()||!UUID.test(id))return;await api("/rest/v1/rpc/admin_set_role",{method:"POST",body:{p_user:id,p_role:"membro"}});closeDlg();toast("Administrador removido.");render()}
};
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t||!A[t.dataset.a])return;e.preventDefault();if(BUSY)return;BUSY=true;
 try{await A[t.dataset.a](t.dataset.id,t)}catch(x){fail(x.message||"Erro inesperado.")}finally{BUSY=false}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox"){const b=e.target.closest("#dc")&&$("#dc .btn.p");if(b){e.preventDefault();b.click()}}});
const route=()=>{CUR=(location.hash||"#inicio").slice(1)||"inicio";render()};
addEventListener("hashchange",route);
(async()=>{if(SES&&SES.expires_at*1000<Date.now()+60000)await refresh();await loadMe();route()})();
</script>
</body>
